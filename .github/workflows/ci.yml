name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package
      - name: Test (unit + integration, JaCoCo gate)
        run: ./mvnw -B -ntp verify
      - name: Test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Backend tests
          path: backend/target/surefire-reports/TEST-*.xml,backend/target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  school-mock:
    name: School mock (build, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: school-mock/pom.xml
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package
      - name: Test (unit + integration, JaCoCo gate)
        run: ./mvnw -B -ntp verify
      - name: Test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: School mock tests
          path: school-mock/target/surefire-reports/TEST-*.xml,school-mock/target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: school-mock-reports
          path: |
            school-mock/target/surefire-reports
            school-mock/target/failsafe-reports
            school-mock/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Frontend tests
          path: frontend/reports/junit.xml
          reporter: java-junit
          fail-on-empty: false
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-reports
          path: |
            frontend/reports
            frontend/coverage
          if-no-files-found: ignore

  deploy-reports:
    name: Deploy reports to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, school-mock, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site/backend/jacoco site/school-mock/jacoco site/frontend/coverage
          cp -r artifacts/backend-reports/site/jacoco/. site/backend/jacoco/ 2>/dev/null || true
          cp -r artifacts/school-mock-reports/site/jacoco/. site/school-mock/jacoco/ 2>/dev/null || true
          cp -r artifacts/frontend-reports/coverage/. site/frontend/coverage/ 2>/dev/null || true
          python3 .github/pages/build_index.py artifacts site "${GITHUB_SHA}" "${GITHUB_RUN_ID}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
